<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + black-translucent hand the status-bar strip to
         the page instead of iOS. Without them, standalone launches put the
         web view in an OS-managed band below the status bar, and iOS has a
         long-standing bug where that band opens a gap above the page until
         the first scroll. The topbar/tabbar pad themselves with
         env(safe-area-inset-*) to draw that strip in their own navy. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Under Pines" />
    <!-- Invite-only network: keep every route out of search indexes and out
         of AI/social crawlers. This is a single-page app with one static
         <head>, so this default covers member profiles, cabins, posts and the
         app shell alike. robots.txt blocks the crawl; this blocks indexing of
         anything fetched anyway (e.g. via a shared link). -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <title>Under Pines — A quiet place on the internet</title>
    <meta name="description" content="Invite-only. Chronological. No metrics that make you feel small. Campfires instead of inboxes. Yours to keep for less than a coffee a year." />
    <meta name="author" content="Under Pines" />
    <meta name="theme-color" content="#052e16" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Under Pines" />
    <meta property="og:title" content="Under Pines" />
    <meta property="og:description" content="A quiet place on the internet — invite-only, chronological, no metrics that make you feel small." />
    <meta property="og:image" content="https://underpines.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter/X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Under Pines" />
    <meta name="twitter:description" content="A quiet place on the internet — invite-only, chronological, no metrics that make you feel small." />
    <meta name="twitter:image" content="https://underpines.com/og-image.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <!-- Dedicated touch icon: full-bleed badge on a solid ground. iOS paints
         transparency black and snapshots the icon at install time, so this
         must be an opaque square — and changing it needs a remove/re-add of
         the Home Screen icon to show up. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Everything the signed-in app does starts with a request to this
         origin (get_boot_state, then the feed). Warming DNS+TCP+TLS here
         runs it in parallel with the JS download instead of after it. Two
         tags on purpose: fetch() uses the CORS connection pool (crossorigin),
         <img> loads of signed media use the plain one. The host is public —
         it ships in the bundle via VITE_SUPABASE_URL; keep in sync with .env. -->
    <link rel="preconnect" href="https://dzwltzkakritkwrsikvb.supabase.co" crossorigin />
    <link rel="preconnect" href="https://dzwltzkakritkwrsikvb.supabase.co" />

    <!-- Self-hosted; see src/styles/fonts.css. Preloaded because the first
         text on screen is set in both families. -->
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/playfair-display-latin.woff2" as="font" type="font/woff2" crossorigin />
</head>

  <body>
    <script>
      // Stamp the saved theme before first paint so the page never renders in
      // the default palette and then swap. ThemeProvider takes over from here.
      (function () {
        try {
          var t = localStorage.getItem('underpines-theme');
          document.documentElement.classList.add(
            ['light', 'dark'].indexOf(t) > -1 ? 'theme-' + t : 'theme-light'
          );
        } catch (e) {
          document.documentElement.classList.add('theme-light');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
