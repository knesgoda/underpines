<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Invite-only network: keep every route out of search indexes and out
         of AI/social crawlers. This is a single-page app with one static
         <head>, so this default covers member profiles, cabins, posts and the
         app shell alike. robots.txt blocks the crawl; this blocks indexing of
         anything fetched anyway (e.g. via a shared link). -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <title>Under Pines — A quiet place on the internet</title>
    <meta name="description" content="Invite-only. Chronological. No metrics that make you feel small. Campfires instead of inboxes. Yours to keep for less than a coffee a year." />
    <meta name="author" content="Under Pines" />
    <meta name="theme-color" content="#052e16" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Under Pines" />
    <meta property="og:title" content="Under Pines" />
    <meta property="og:description" content="A quiet place on the internet — invite-only, chronological, no metrics that make you feel small." />
    <meta property="og:image" content="https://underpines.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter/X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Under Pines" />
    <meta name="twitter:description" content="A quiet place on the internet — invite-only, chronological, no metrics that make you feel small." />
    <meta name="twitter:image" content="https://underpines.com/og-image.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/pwa-icon-192.png" />

    <!-- Self-hosted; see src/styles/fonts.css. Preloaded because the first
         text on screen is set in both families. -->
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/playfair-display-latin.woff2" as="font" type="font/woff2" crossorigin />
</head>

  <body>
    <script>
      // Stamp the saved theme before first paint so the page never renders in
      // the default palette and then swap. ThemeProvider takes over from here.
      (function () {
        try {
          var t = localStorage.getItem('underpines-theme');
          document.documentElement.classList.add(
            ['light', 'dark'].indexOf(t) > -1 ? 'theme-' + t : 'theme-light'
          );
        } catch (e) {
          document.documentElement.classList.add('theme-light');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
