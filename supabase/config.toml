# Every edge function is declared here so its auth posture is in version control
# and cannot drift silently in the dashboard. Two postures:
#
#   verify_jwt = true   The platform requires a valid JWT (a signed-in member's,
#                       or the public anon key for pre-auth landings). Most of
#                       these ALSO re-verify a real member via getUser()/
#                       requireUser() in the body.
#
#   verify_jwt = false  No user JWT. Used only where the caller authenticates a
#                       different way: Stripe webhook signatures, a CRON_SECRET
#                       shared secret, a single-use capability token in the URL,
#                       or a deliberately public endpoint that gates itself.

# ---------------------------------------------------------------------------
# Stripe webhooks — authenticated by Stripe's request signature, never a JWT.
[functions.stripe-webhook]
verify_jwt = false

[functions.stripe-connect-webhook]
verify_jwt = false

# ---------------------------------------------------------------------------
# Scheduled / service-to-service — gated on the CRON_SECRET shared secret
# (header `x-cron-secret`); the bodies refuse to run without it.
[functions.process-monthly-payouts]
verify_jwt = false

[functions.check-block-thresholds]
verify_jwt = false

[functions.send-push-notification]
verify_jwt = false

[functions.send-daily-ember]
verify_jwt = false

[functions.send-camp-newsletters]
verify_jwt = false

[functions.campfire-lifecycle]
verify_jwt = false

[functions.send-grove-weekly-report]
verify_jwt = false

[functions.check-reporter-patterns]
verify_jwt = false

[functions.camp-health-check]
verify_jwt = false

[functions.send-annual-wrapped]
verify_jwt = false

[functions.inactive-member-nudge]
verify_jwt = false

[functions.activate-seasonal-events]
verify_jwt = false

# ---------------------------------------------------------------------------
# Public, self-gating endpoints — reachable without a session by design.
# handle-parental-consent authenticates a single-use token from an email link;
# join-waitlist derives its own per-IP rate limit and validates the email.
[functions.handle-parental-consent]
verify_jwt = false

[functions.join-waitlist]
verify_jwt = false

# ---------------------------------------------------------------------------
# Pre-auth landing helpers — called from logged-out routes with the anon key
# (a valid JWT), so verify_jwt stays on.
[functions.validate-invite]
verify_jwt = true

# ---------------------------------------------------------------------------
# Member-only — verify_jwt on, and each re-verifies a real member in the body.
[functions.triage-report]
verify_jwt = true

[functions.fetch-og-metadata]
verify_jwt = true

# Redacted diagnostics for private post-media read failures.
[functions.log-media-access-failure]
verify_jwt = true


[functions.send-parental-consent]
verify_jwt = true

[functions.spotify-search]
